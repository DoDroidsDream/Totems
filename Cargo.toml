[package]
name = "totems"
version = "0.1.0"
edition = "2024"
description = "Instant search and preview for every audio file on your machine."

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = "0.37.0"
memchr = "2.8.3"
notify = "8.2.2"
parking_lot = "0.13.0"
rayon = "1.12.0"
regex = "1.13.2"
# Already in the build via eframe's persistence; used to read settings field by field.
ron = "0.12.3"
rfd = "0.18.0"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["all"] }

# Native drag-and-drop of files out of the window (Windows only).
[target.'cfg(windows)'.dependencies]
drag = "2.1.1"
# Lets Explorer come to the front when Ctrl+click opens a folder.
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true

# Decoding in debug builds is painfully slow; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 3
